[package]
name = "brouhaha"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["David Palmer"]
description = "A type-driven combat kernel for old-school basic/expert fantasy rules"
repository = "https://github.com/dp88/brouhaha"
license = "MIT OR Apache-2.0"
keywords = ["ttrpg", "osr", "combat", "gamedev", "no-std"]
categories = ["game-development", "no-std"]
readme = "README.md"
exclude = [".github/", "art/", "RELEASING.md", "deny.toml"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
serde = ["dep:serde"]
spacewalk = ["dep:spacewalk"]

[lints.rust]
missing_docs = "warn"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
# Not yet on crates.io; the version readies the manifest for when it is.
spacewalk = { version = "0.1", git = "https://github.com/dp88/spacewalk", optional = true }

[dev-dependencies]
serde_json = "1"
