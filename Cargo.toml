[package]
name = "brouhaha"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["David Palmer"]
description = "A type-driven combat kernel for old-school basic/expert fantasy rules"
repository = "https://github.com/dp88/brouhaha"
license = "MIT OR Apache-2.0"
keywords = ["ttrpg", "osr", "combat", "gamedev", "no-std"]
categories = ["game-development", "no-std"]
exclude = [".github/", "art/banner.af"]

[features]
default = []
serde = ["dep:serde"]
spacewalk = ["dep:spacewalk"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
spacewalk = { version = "0.1", path = "../spacewalk", optional = true }

[dev-dependencies]
serde_json = "1"
